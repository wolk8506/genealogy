name: Test (unit)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  unit-linux:
    name: npm test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

  unit-windows:
    name: npm test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test
