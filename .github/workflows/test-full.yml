name: Test (full)

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  full:
    name: npm test (incl. mock:library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Run full test suite
        run: npm run test:full

      - name: Coverage (main handlers)
        run: npm run test:coverage
