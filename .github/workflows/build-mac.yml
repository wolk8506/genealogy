name: Build macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.13.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Build React
        run: npm run build:react

      - name: Generate DMG background
        run: npm run dmg:background

      - name: Build DMG (ARM64)
        run: npx electron-builder --mac --arm64 --publish never

      - name: Prepare release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v ver="$VERSION" '
            /^## v/ {
              split($0, a, " "); take = (a[2] == "v" ver)
              if (!take && taking) exit
              taking = take; next
            }
            taking { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no block for version $VERSION"
            exit 1
          fi

      - name: Create Release and Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "Release ${{ inputs.version }}"
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            dist_electron/*.dmg
            dist_electron/*.blockmap
            dist_electron/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
